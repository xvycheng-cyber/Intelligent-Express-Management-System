# 复制为 application-local.yml 后填写本机 root 口令（该文件已被 .gitignore 忽略）。
# 本文件只允许占位符，禁止写入真实密码。
#
# 本配置仅用于个人电脑上的课程设计与本地演示：
#   - 应用使用 MySQL root 账号（127.0.0.1:3306）
